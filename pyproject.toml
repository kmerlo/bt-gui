[project]
name = "bt-gui"
version = "0.1.0"
description = "Visual GUI for bt backtesting framework (React + FastAPI, integrable in Stocks_App)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bt>=1.2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "pandas>=2.0",
    "numpy>=1.26,<3.0",
    "cython>=0.29.25",
    "ffn>=1.1.2",
    "yfinance>=1.0,<2",
    "python-multipart>=0.0.9",
    "aiofiles>=23.0",
    "websockets>=12.0",
    "httpx>=0.28.1",
    "pyarrow>=25.0.1",
    "pandas-ta-classic>=0.6.52",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.10",
    "pytest-cov>=6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 180

[tool.ruff.lint]
select = ["E", "F"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.uv.sources]
bt = { path = "../bt", editable = true }

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
ignore_missing_imports = true
strict_optional = true
disable_error_code = ["attr-defined", "operator", "index", "var-annotated", "override", "union-attr", "call-arg", "has-type", "no-any-return"]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
