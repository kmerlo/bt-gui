name: ci
on: [push, pull_request]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv && uv sync --group dev && uv run ruff check . && uv run ruff format --check . && uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --prefix frontend && npm run typecheck --prefix frontend && npm run lint --prefix frontend && npm run build --prefix frontend && npx vitest run --prefix frontend
